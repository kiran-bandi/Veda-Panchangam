name: Build Android App Bundle (AAB)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare environment
        run: |
          touch .env

      - name: Generate Release Signing Key
        run: |
          keytool -genkey -v -keystore my-upload-key.jks \
            -alias upload -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Panchangam, OU=App, O=Dev, L=Hyderabad, S=Telangana, C=IN"

      - name: Build Android App Bundle (.aab)
        env:
          KEYSTORE_PATH: my-upload-key.jks
          STORE_PASSWORD: android
          KEY_PASSWORD: android
        run: gradle :app:bundleRelease --no-daemon --stacktrace

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: playstore-release-aab
          path: app/build/outputs/bundle/release/*.aab
